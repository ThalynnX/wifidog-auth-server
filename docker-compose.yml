version: "3.8"

services:
  freeradius:
    image: freeradius/freeradius-server:3.2
    container_name: wifidog-freeradius
    restart: unless-stopped
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      - ./deploy/freeradius/clients.conf:/etc/freeradius/clients.conf:ro
      - ./deploy/freeradius/users:/etc/freeradius/users:ro
    networks:
      - wifidog-net

  wifidog-auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wifidog-auth
    restart: unless-stopped
    ports:
      - "2060:2060"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 2060
      AUTH_SERVER_URL: http://1.13.168.245:2060
      RADIUS_SERVER_HOST: freeradius
      RADIUS_SERVER_PORT: 1812
      RADIUS_SECRET: wifidog_radius_secret_change_me
      RADIUS_NAS_IP: 172.20.0.2
      RADIUS_TIMEOUT_MS: 5000
      RADIUS_RETRIES: 2
      DB_PATH: /app/data/wifidog.db
      TOKEN_EXPIRY: 3600
      DEFAULT_GATEWAY_ADDRESS: 192.168.6.1
      DEFAULT_GATEWAY_ID: jdcloud_re_ss_01
    volumes:
      - ./data:/app/data
    depends_on:
      - freeradius
    networks:
      - wifidog-net

networks:
  wifidog-net:
    driver: bridge
