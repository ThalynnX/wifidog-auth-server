version: '3.8'
services:
  freeradius:
    image: freeradius/freeradius-server:latest
    container_name: freeradius
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      - ./freeradius/clients.conf:/etc/freeradius/clients.conf:ro
      - ./freeradius/users:/etc/freeradius/users:ro
    restart: unless-stopped
    networks:
      - wifidog-net
  wifidog-auth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wifidog-auth
    ports:
      - "2060:2060"
    environment:
      - PORT=2060
      - HOST=0.0.0.0
      - RADIUS_SERVER_HOST=freeradius
      - RADIUS_SERVER_PORT=1812
      - RADIUS_SECRET=testing123
      - DB_PATH=/app/data/wifidog.db
      - TOKEN_EXPIRY=3600
    volumes:
      - ./data:/app/data
    depends_on:
      - freeradius
    restart: unless-stopped
    networks:
      - wifidog-net
networks:
  wifidog-net:
    driver: bridge