<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111d">
<title>{{ site_name }} · 管理登录</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/ui.css?v=2.0.2">
</head>
<body class="portal-body">
<main class="portal-wrap">
  <div class="portal-top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 17a11 11 0 0 1 16 0M7 13.5a7 7 0 0 1 10 0M10.2 10.2a3 3 0 0 1 3.6 0"/><circle cx="12" cy="19" r="1"/></svg></div>
      <div><div class="brand-name">{{ site_name }}</div><div class="brand-sub">Network Operations</div></div>
    </div>
    <div class="portal-status"><i class="live-dot"></i>SECURE ACCESS</div>
  </div>

  <section class="portal-card">
    <div class="portal-hero">
      <div class="eyebrow">Management Console</div>
      <h1 class="portal-title" style="margin-top:8px">运营管理控制台</h1>
      <p class="portal-sub">认证网关 · 套餐计费 · 终端状态 · 系统配置</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">管理员账号</label>
        <input class="input" id="username" name="username" placeholder="请输入管理员账号" autocomplete="username" maxlength="64" required autofocus>
      </div>
      <div class="field">
        <label for="password">登录密码</label>
        <div class="input-row">
          <input class="input" id="password" name="password" type="password" placeholder="请输入登录密码" autocomplete="current-password" maxlength="128" required>
          <button class="btn ghost" id="togglePwd" type="button" aria-label="显示密码">显示</button>
        </div>
      </div>
      <button class="btn block" id="loginBtn" type="submit">进入控制台</button>
      <div class="form-msg" id="msg" role="status" aria-live="polite"></div>
    </form>

    <div class="portal-foot">首次部署默认账号 admin / admin123<br>登录后请立即前往「系统设置」修改密码</div>
  </section>
  <div style="text-align:center;margin-top:18px" class="eyebrow">WIFIDOG AUTH SERVER · V2.0.2</div>
</main>
<script src="/static/ui.js?v=2.0.2"></script>
<script>
(function(){
  const form = document.getElementById('loginForm');
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('msg');
  const pwd = document.getElementById('password');
  const say = (text, type) => { msg.textContent = text || ''; msg.className = 'form-msg' + (type ? ' ' + type : ''); };

  if (new URLSearchParams(location.search).get('expired')) say('登录已过期，请重新登录', 'info');

  document.getElementById('togglePwd').onclick = function(){
    const show = pwd.type === 'password';
    pwd.type = show ? 'text' : 'password';
    this.textContent = show ? '隐藏' : '显示';
    this.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
    pwd.focus();
  };

  form.onsubmit = async function(event){
    event.preventDefault();
    if (btn.dataset.busy === '1') return;
    const username = document.getElementById('username').value.trim();
    const password = pwd.value;
    if (!username) { say('请输入管理员账号'); document.getElementById('username').focus(); return; }
    if (!password) { say('请输入登录密码'); pwd.focus(); return; }
    UI.busy(btn, true, '正在验证身份…'); say('正在连接认证服务…', 'info');
    const r = await UI.post('/admin/api/login', {username, password});
    if (r.ok) { say('验证通过，正在进入控制台…', 'ok'); location.href = '/admin/'; return; }
    UI.busy(btn, false); say(r.msg || '登录失败，请检查账号和密码');
    pwd.select();
  };
})();
</script>
</body>
</html>
