<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02040a">
<meta name="robots" content="noindex, nofollow">
<title>支付成功</title>
<style>
:root{
  --bg:#02040a;
  --ink:#eaffff;
  --cyan:#41f3ff;
  --teal:#00ffc8;
  --gold:#ffd166;
  --line:rgba(65,243,255,.18);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
}
.scene,.stage{position:fixed;inset:0}
.scene{overflow:hidden;isolation:isolate}
.stars{position:absolute;inset:0;width:100%;height:100%;opacity:.85}
.aurora{
  position:absolute;inset:-20%;
  background:
    radial-gradient(38% 32% at 52% 42%,rgba(65,243,255,.16),transparent 68%),
    radial-gradient(30% 26% at 28% 68%,rgba(0,255,200,.09),transparent 72%),
    radial-gradient(28% 30% at 78% 24%,rgba(255,209,102,.055),transparent 72%),
    #02040a;
  filter:saturate(1.15);
}
.grid-wrap{
  position:absolute;left:-25%;right:-25%;bottom:-10%;height:52%;
  perspective:620px;perspective-origin:50% 0;
  opacity:.52;
  mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.75) 38%,transparent 92%);
  -webkit-mask-image:linear-gradient(to top,#000 0%,rgba(0,0,0,.75) 38%,transparent 92%);
}
.grid{
  position:absolute;inset:-30% -10% -10%;
  transform:rotateX(64deg) scale(1.35);
  transform-origin:50% 100%;
  background-image:
    linear-gradient(to right,rgba(65,243,255,.19) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(65,243,255,.16) 1px,transparent 1px);
  background-size:64px 64px;
  animation:gridDrift 12s linear infinite;
}
@keyframes gridDrift{to{background-position:0 64px,0 64px}}
.vignette{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 45%,transparent 0%,rgba(2,4,10,.18) 44%,rgba(2,4,10,.78) 100%),
    linear-gradient(180deg,rgba(2,4,10,.55),transparent 22%,transparent 76%,rgba(2,4,10,.82));
}
.scanlines{
  position:absolute;inset:0;pointer-events:none;opacity:.45;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.025) 0 1px,transparent 1px 4px);
  mix-blend-mode:screen;
}
.noise{
  position:absolute;inset:-40%;pointer-events:none;opacity:.055;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E");
  animation:noiseShift .9s steps(2) infinite;
}
@keyframes noiseShift{
  0%{transform:translate3d(0,0,0)}
  25%{transform:translate3d(-1.5%,1%,0)}
  50%{transform:translate3d(1%,-1.5%,0)}
  75%{transform:translate3d(1.5%,1.5%,0)}
  100%{transform:translate3d(0,0,0)}
}
.hud{position:absolute;inset:0;pointer-events:none;color:var(--cyan);opacity:.55}
.hud::before,.hud::after{
  content:"";position:absolute;left:50%;width:min(54vw,620px);height:1px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,rgba(65,243,255,.55),transparent);
}
.hud::before{top:max(22px,5.2vh)}
.hud::after{bottom:max(22px,5.2vh);opacity:.45}
.corner{position:absolute;width:44px;height:44px;border-color:rgba(65,243,255,.25);border-style:solid}
.corner.tl{left:22px;top:22px;border-width:1px 0 0 1px}
.corner.tr{right:22px;top:22px;border-width:1px 1px 0 0}
.corner.bl{left:22px;bottom:22px;border-width:0 0 1px 1px}
.corner.br{right:22px;bottom:22px;border-width:0 1px 1px 0}
.stage{
  display:grid;place-items:center;
  padding:max(30px,6vh) 24px;
  text-align:center;z-index:2;
}
.content{display:flex;flex-direction:column;align-items:center;gap:clamp(26px,4.5vh,44px)}
.orb{
  position:relative;width:clamp(190px,42vw,300px);aspect-ratio:1;
  display:grid;place-items:center;
  filter:drop-shadow(0 0 30px rgba(65,243,255,.15));
}
.orb::before{
  content:"";position:absolute;inset:14%;border-radius:50%;
  background:radial-gradient(circle,rgba(65,243,255,.13),rgba(65,243,255,.035) 44%,transparent 70%);
  box-shadow:0 0 80px rgba(65,243,255,.12) inset;
}
.ring{position:absolute;border-radius:50%;pointer-events:none}
.ring-a{
  inset:0;
  background:conic-gradient(from 0deg,transparent 0 8%,rgba(65,243,255,.9) 12%,transparent 22%,transparent 52%,rgba(0,255,200,.85) 58%,transparent 68%,transparent 100%);
  mask:radial-gradient(circle,transparent 64%,#000 65% 69%,transparent 70%);
  -webkit-mask:radial-gradient(circle,transparent 64%,#000 65% 69%,transparent 70%);
  animation:spin 8.5s linear infinite;
  opacity:.82;
}
.ring-b{
  inset:7%;
  border:1px solid rgba(65,243,255,.20);
  box-shadow:0 0 22px rgba(65,243,255,.06) inset;
  animation:spinReverse 14s linear infinite;
}
.ring-b::before,.ring-b::after{
  content:"";position:absolute;width:7px;height:7px;border-radius:50%;
  background:var(--cyan);box-shadow:0 0 12px var(--cyan);
}
.ring-b::before{left:50%;top:-4px;transform:translateX(-50%)}
.ring-b::after{left:50%;bottom:-4px;transform:translateX(-50%);background:var(--teal);box-shadow:0 0 12px var(--teal)}
.ring-c{
  inset:18%;
  border:1px dashed rgba(65,243,255,.28);
  animation:spin 20s linear infinite;
}
.ticks{position:absolute;inset:-4%;border-radius:50%;opacity:.42}
.tick{position:absolute;left:50%;top:50%;width:1px;height:7px;background:rgba(65,243,255,.55);transform-origin:0 0}
.core{
  position:relative;width:47%;aspect-ratio:1;border-radius:50%;
  display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,rgba(65,243,255,.16),rgba(0,255,200,.045) 52%,rgba(2,4,10,.9) 74%);
  border:1px solid rgba(65,243,255,.34);
  box-shadow:
    0 0 0 6px rgba(65,243,255,.035),
    0 0 34px rgba(65,243,255,.16),
    0 0 80px rgba(65,243,255,.075) inset;
}
.core::after{
  content:"";position:absolute;inset:-14%;border-radius:50%;
  background:radial-gradient(circle,transparent 54%,rgba(65,243,255,.10) 55%,transparent 58%);
  animation:pulse 2.8s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.98)}50%{opacity:.9;transform:scale(1.04)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinReverse{to{transform:rotate(-360deg)}}
.check{width:58%;height:58%;overflow:visible}
.check path{
  fill:none;stroke:url(#checkGrad);stroke-width:6;
  stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:120;stroke-dashoffset:0;
  filter:drop-shadow(0 0 8px rgba(65,243,255,.7));
  animation:draw 1.15s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes draw{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}
h1{
  position:relative;
  font-size:clamp(38px,7.4vw,64px);
  line-height:1.1;font-weight:600;letter-spacing:.18em;
  padding-left:.18em;
  background:linear-gradient(180deg,#ffffff 4%,#d7feff 38%,#61f6ff 76%,#13cfe6 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(65,243,255,.25));
  opacity:1;transform:translateY(0);
  animation:titleIn .7s ease-out forwards;
}
h1::after{
  content:"";position:absolute;left:50%;bottom:-18px;width:64%;height:1px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,rgba(65,243,255,.8),transparent);
  box-shadow:0 0 10px rgba(65,243,255,.55);
}
@keyframes titleIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.flare{
  position:absolute;left:50%;top:50%;width:1px;height:1px;pointer-events:none;
  box-shadow:0 0 70px 18px rgba(65,243,255,.12);
}
@media (max-height:560px){
  .content{gap:18px}
  .orb{width:min(34vh,210px)}
  h1{font-size:clamp(30px,6vh,42px)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  .check path{stroke-dashoffset:0}
  h1{opacity:1;transform:none}
}
</style>
</head>
<body>
<div class="scene" aria-hidden="true">
  <div class="aurora"></div>
  <canvas class="stars" id="starfield"></canvas>
  <div class="grid-wrap"><div class="grid"></div></div>
  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="noise"></div>
  <div class="hud">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
  </div>
</div>

<main class="stage" role="status" aria-live="polite">
  <div class="content">
    <div class="orb" aria-hidden="true">
      <div class="ticks" id="ticks"></div>
      <div class="ring ring-a"></div>
      <div class="ring ring-b"></div>
      <div class="ring ring-c"></div>
      <div class="core">
        <svg class="check" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="checkGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#eaffff"/>
              <stop offset=".45" stop-color="#41f3ff"/>
              <stop offset="1" stop-color="#00ffc8"/>
            </linearGradient>
          </defs>
          <path d="M14 34.5 L26.5 47 L50 20"/>
        </svg>
      </div>
      <div class="flare"></div>
    </div>
    <h1>支付成功</h1>
  </div>
</main>

<script>
(() => {
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ticks = document.getElementById("ticks");
  if (ticks) {
    const n = 48;
    for (let i = 0; i < n; i++) {
      const el = document.createElement("span");
      el.className = "tick";
      el.style.transform = `rotate(${i * (360 / n)}deg) translateY(-${46}%)`;
      if (i % 6 === 0) el.style.opacity = ".9";
      ticks.appendChild(el);
    }
  }

  const canvas = document.getElementById("starfield");
  if (!canvas) return;
  const ctx = canvas.getContext("2d", { alpha: true });
  let w = 0, h = 0, dpr = 1;
  let stars = [];
  let raf = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + "px";
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.max(28, Math.min(72, Math.floor((w * h) / 26000)));
    stars = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - .5) * .16,
      vy: (Math.random() - .5) * .16,
      r: Math.random() * 1.4 + .3,
      a: Math.random() * .55 + .18
    }));
  }

  function frame() {
    ctx.clearRect(0, 0, w, h);
    for (const s of stars) {
      s.x += s.vx; s.y += s.vy;
      if (s.x < -20) s.x = w + 20;
      if (s.x > w + 20) s.x = -20;
      if (s.y < -20) s.y = h + 20;
      if (s.y > h + 20) s.y = -20;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(140,248,255,${s.a})`;
      ctx.fill();
    }
    for (let i = 0; i < stars.length; i++) {
      for (let j = i + 1; j < stars.length; j++) {
        const a = stars[i], b = stars[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 15000) {
          const alpha = (1 - d2 / 15000) * .14;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(65,243,255,${alpha})`;
          ctx.lineWidth = .6;
          ctx.stroke();
        }
      }
    }
    if (!reduced) raf = requestAnimationFrame(frame);
  }

  resize();
  window.addEventListener("resize", resize, { passive: true });
  frame();
  if (reduced) cancelAnimationFrame(raf);
})();
</script>
</body>
</html>
