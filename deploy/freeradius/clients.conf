# FreeRADIUS clients 配置
# 允许认证服务器 (Docker 网络或本地) 访问

client 127.0.0.1 {
    secret = wifidog_radius_secret_change_me
    shortname = localhost
}

client 172.20.0.0/16 {
    secret = wifidog_radius_secret_change_me
    shortname = wifidog_docker
}

# 路由器端 (如果直接从路由器发起 RADIUS)
client 192.168.6.0/24 {
    secret = wifidog_radius_secret_change_me
    shortname = lan_network
}
