# WiFiDog 认证门户 - Nginx 站点模板
# 用法：
#   1) 复制到 /etc/nginx/conf.d/wifidog.conf（或 sites-available 后软链）
#   2) 把 portal.example.com 换成你的域名，/opt/wifidog 换成实际目录
#   3) nginx -t && systemctl reload nginx
#   4) 生产环境用 certbot --nginx -d 你的域名 申请证书（会自动补 443 配置）

upstream wifidog_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name portal.example.com;

    # certbot 验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 8m;
    access_log /var/log/nginx/wifidog_access.log;
    error_log  /var/log/nginx/wifidog_error.log;

    # 静态资源直接由 Nginx 提供
    location /static/ {
        alias /opt/wifidog/app/static/;
        expires 7d;
        access_log off;
    }

    # apfree-wifidogx 长连接（路径必须与路由器 WebSocket URI path 一致）
    location /ws/wifidogx {
        proxy_pass http://wifidog_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # 网关协议与业务接口
    location / {
        proxy_pass http://wifidog_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
