# FreeRADIUS main configuration (custom minimal)
prefix = /usr
exec_prefix = ${prefix}
sysconfdir = ${prefix}/etc/freeradius
localstatedir = /var
logdir = /var/log/freeradius
raddbdir = ${sysconfdir}/freeradius
name = freeradius
confdir = ${raddbdir}
run_dir = ${localstatedir}/run/${name}
pidfile = ${run_dir}/${name}.pid

max_request_time = 30
cleanup_delay = 5
max_requests = 16384

listen {
    type = auth
    ipaddr = *
    port = 1812
}
listen {
    type = acct
    ipaddr = *
    port = 1813
}

hostname = localhost

log {
    destination = files
    file = ${logdir}/radius.log
    log_auth = yes
    log_auth_badpass = yes
    log_auth_goodpass = yes
}

security {
    max_attributes = 200
    reject_delay = 1
    status_server = yes
}

thread pool {
    start_servers = 5
    max_servers = 32
    min_spare_servers = 3
    max_spare_servers = 10
}

modules {
    $INCLUDE ${confdir}/mods-enabled/
}

authorize {
    files
}

authenticate {
    Auth-Type PAP {
        pap
    }
}

$INCLUDE ${confdir}/sites-enabled/
$INCLUDE ${confdir}/clients.conf
