# FreeRADIUS clients configuration
# IMPORTANT: `secret` must match RADIUS_SECRET in the auth server .env / docker-compose

client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
    require_message_authenticator = no
    nas_type = other
    shortname = localhost
}

# Allow the Node.js auth server running inside the docker-compose bridge network
client docker-net {
    ipaddr = 172.16.0.0/12
    secret = testing123
    require_message_authenticator = no
    nas_type = other
    shortname = wifidog-auth
}
